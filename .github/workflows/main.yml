name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create gradlew
        run: |
          echo '#!/bin/bash' > gradlew
          echo './gradlew assembleDebug' >> gradlew
          chmod +x gradlew

      - name: List files
        run: ls -R

      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug
